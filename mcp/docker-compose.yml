name: mcp-servers

services:

  # ── Office MCP tool server ──────────────────────────────────────────────────
  # Tools: file system, SQLite, web fetch, calculator, git, ChromaDB search, browser screenshot
  # SSE  (LibreChat / stdio clients):  http://localhost:8097/sse
  # HTTP (llama-ui / Cursor / etc.):   http://localhost:8097/mcp
  # Help page:                         http://localhost:8097/help
  office-mcp:
    build: ./office-mcp
    container_name: office-mcp
    restart: unless-stopped
    ports:
      - "8097:8097"
    volumes:
      - ./office-mcp:/app            # live-reload source during dev
      - office_mcp_data:/app/data    # persistent DB + chroma + files
    environment:
      - MCP_BASE_DIR=/app/data
      - MCP_SQLITE_PATH=/app/data/office.db
      - MCP_CHROMA_PATH=/app/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost', 8097)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Code Sandbox MCP server ─────────────────────────────────────────────────
  # Tools: run_python, run_python_async, job_status, job_list, job_kill, install_package, sandbox_info
  # SSE  (LibreChat / stdio clients):  http://localhost:8098/sse
  # HTTP (llama-ui / Cursor / etc.):   http://localhost:8098/mcp
  # Help page:                         http://localhost:8098/help
  code-sandbox:
    build: ./code-sandbox
    container_name: code-sandbox
    restart: unless-stopped
    ports:
      - "8098:8098"
    volumes:
      - code_sandbox_data:/app/sandbox_data
    environment:
      - SANDBOX_DIR=/app/sandbox_data
      - SANDBOX_CPU_SECS=30
      - SANDBOX_MAX_OUTPUT=262144   # 256 KB
      - SANDBOX_MAX_JOBS=20
      - SANDBOX_PORT=8098
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost', 8098)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  office_mcp_data:
  code_sandbox_data:
