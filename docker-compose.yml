name: librechat # keeps volume names consistent regardless of which directory you run from

services:

  # ── Llama.cpp inference server ─────────────────────────────────────────────
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-server
    restart: unless-stopped
    ports:
      - "8099:8099" # access at http://localhost:8099
    volumes:
      - /media/aza/shared/models:/models:ro # mount model dir read-only
    command: >
      --model /models/gemma-4-12b-it-qat-q4_0.gguf --mmproj /models/mmproj-gemma-4-12b-it-qat-q4_0.gguf  --host 0.0.0.0 --port 8099 --n-gpu-layers 99 --ctx-size 32769 --threads 4 --timeout 60   --parallel 4 --cont-batching 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  # ── LibreChat front-end ─────────────────────────────────────────────────────
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: librechat
    restart: unless-stopped
    ports:
      - "3080:3080"
    depends_on:
      mongodb:
        condition: service_started
      meilisearch:
        condition: service_started
      office-mcp:
        condition: service_healthy
      code-sandbox:
        condition: service_healthy
      docs-mcp:
        condition: service_healthy
    env_file:
      - ./librechat/.env
    volumes:
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
      - ./librechat/data:/app/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Office MCP tool server ──────────────────────────────────────────────────
  office-mcp:
    build: ./mcp/office-mcp
    container_name: office-mcp
    restart: unless-stopped
    ports:
      - "8097:8097" # SSE endpoint — reachable at http://localhost:8097/sse from host
    volumes:
      - ./mcp/office-mcp:/app
      - ./mcp/office-mcp/data:/app/data
    environment:
      - MCP_BASE_DIR=/app/data
      - MCP_SQLITE_PATH=/app/data/office.db
      - MCP_CHROMA_PATH=/app/data/chroma
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost', 8097)); s.close()" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  
  # ── Docs MCP server ─────────────────────────────────────────────────────────
  # Tools: pdf_read, pdf_info, docx_read, docx_write
  # SSE endpoint: http://localhost:8096/sse  |  HTTP: http://localhost:8096/mcp  |  Help: http://localhost:8096/help
  docs-mcp:
    build: ./mcp/docs-mcp
    container_name: docs-mcp
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - docs_data:/app/docs_data
    environment:
      - DOCS_MCP_PORT=8096
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost', 8096)); s.close()" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Code Sandbox MCP server ─────────────────────────────────────────────────
  code-sandbox:
    build: ./mcp/code-sandbox
    container_name: code-sandbox
    restart: unless-stopped
    ports:
      - "8098:8098" # SSE endpoint — reachable at http://localhost:8098/sse from host
    volumes:
      - code_sandbox_data:/app/sandbox_data
    environment:
      - SANDBOX_DIR=/app/sandbox_data
      - SANDBOX_CPU_SECS=30
      - SANDBOX_MAX_OUTPUT=262144 # 256 KB
      - SANDBOX_MAX_JOBS=20
      - SANDBOX_PORT=8098
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost', 8098)); s.close()" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: librechat-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  # ── Meilisearch ─────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: librechat-meilisearch
    restart: unless-stopped
    env_file:
      - ./librechat/.env # contains MEILI_MASTER_KEY (and other vars, ignored by meili)
    environment:
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data

volumes:
  mongodb_data:
  meilisearch_data:
  librechat_uploads:
  librechat_logs:
  code_sandbox_data:
  docs_data:
