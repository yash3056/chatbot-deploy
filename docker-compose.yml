services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-server
    restart: unless-stopped

    ports:
      - "8099:8099"          # access at http://localhost:8099

    volumes:
      - /media/aza/shared/models:/models:ro   # mount model dir read-only

    command: >
      --model /models/gemma-4-12b-it-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8099
      --n-gpu-layers 99
      --ctx-size 16384
      --threads 4

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]