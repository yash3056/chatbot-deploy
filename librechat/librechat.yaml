version: 1.1.5
cache: true

endpoints:
  custom:
    - name: "Gemma 4 Local"
      apiKey: "dummy"                              # llama.cpp needs no real key
      baseURL: "http://host.docker.internal:8099/v1"
      models:
        default: ["gemma-4-12b-it-Q4_K_M.gguf"]
        fetch: false                               # don't try to auto-fetch model list
      titleConvo: true
      titleModel: "gemma-4-12b-it-Q4_K_M.gguf"
      modelDisplayLabel: "Gemma 4 12B (Local)"
      summarize: false
      forcePrompt: false

mcpServers:
  office-tools:
    # Both containers share the Docker bridge network, so use the service name directly.
    type: sse
    url: "http://office-mcp:8097/sse"
    requiresOAuth: false   # no OAuth, plain HTTP

  code-sandbox:
    # Python sandbox — run, poll, and kill code execution jobs
    type: sse
    url: "http://code-sandbox:8098/sse"
    requiresOAuth: false

  docs-mcp:
    # PDF reader and DOCX read/write
    type: sse
    url: "http://docs-mcp:8096/sse"
    requiresOAuth: false

mcpSettings:
  # LibreChat blocks internal/private hostnames by default (security feature).
  # Explicitly allow both Docker service names so LibreChat can reach them.
  allowedAddresses:
    - "office-mcp:8097"
    - "code-sandbox:8098"
    - "docs-mcp:8096"